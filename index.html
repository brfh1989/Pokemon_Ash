<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Final Fantasy I & II: Dawn of Souls</title>
    <style>
        /* Pantalla completa y fondo negro */
        body, html { margin: 0; padding: 0; height: 100%; background-color: #000; overflow: hidden; }
        #game-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <!-- Contenedor del reproductor -->
    <div id="game-container"></div>

    <script>
        EJS_player = '#game-container';
        
        // Núcleo de Game Boy Advance
        EJS_core = 'gba'; 
        
        // Nombre del archivo ROM que tienes en tu carpeta/repositorio
        EJS_gameUrl = 'final_fantasy_dawn_of_souls.gba'; 

        EJS_startOnLoaded = true;
        
        // Rutas de datos del emulador
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/';
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js"></script>
</body>
</html>
